<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Browser</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main>
    <section class="topline">
      <div class="brandline">
        <span class="brand-mark">B</span>
        <div>
          <strong>Browser</strong>
          <span class="mode-label">Pronto</span>
        </div>
      </div>
      <div class="clock-block">
        <strong class="clock">--:--</strong>
        <span class="date">—</span>
      </div>
    </section>

    <section class="hero">
      <p class="eyebrow">NAVIGA SENZA RUMORE</p>
      <h1>Cosa vuoi trovare?</h1>
      <form id="normal-search">
        <input id="q" type="search" autocomplete="off" placeholder="Cerca sul web o digita quello che ti serve" autofocus>
        <button type="submit">Cerca</button>
      </form>
      <div class="actions">
        <button id="smart" class="primary">
          <b>SMART SEARCH</b>
          <span>Filtra e riordina i risultati per pertinenza reale</span>
        </button>
        <button id="library">
          <b>Libreria</b>
          <span>Cronologia · Preferiti · Download</span>
        </button>
        <button id="addons">
          <b>Addon</b>
          <span>Gestisci o trova estensioni</span>
        </button>
      </div>
    </section>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
