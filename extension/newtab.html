<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>FILUM</title>
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="page">
    <header class="hud">
      <div class="mini-brand">
        <img src="icons/browser.png" alt="">
        <div>
          <strong>FILUM</strong>
          <span class="mode-label">NORMAL</span>
        </div>
      </div>
      <div class="clock-block">
        <strong class="clock">--:--</strong>
        <span class="date">—</span>
      </div>
    </header>

    <section class="hero">
      <img class="hero-logo" src="icons/browser.png" alt="">
      <div class="wordmark">FILUM</div>
      <p class="tagline">Naviga leggero. Più libero.</p>

      <form id="normal-search" class="search-box">
        <input id="q" type="search" autocomplete="off"
               placeholder="Cerca nel web con FILUM…" autofocus>
        <button type="submit" aria-label="Cerca">Cerca</button>
      </form>

      <div class="quick-actions">
        <button id="smart" class="quick primary">
          <b>SMART SEARCH</b>
          <span>Ricerca filtrata e contestuale</span>
        </button>
        <button id="library" class="quick">
          <b>LIBRERIA</b>
          <span>Preferiti · cronologia · download</span>
        </button>
        <button id="addons" class="quick">
          <b>ADDON</b>
          <span>Estensioni e strumenti</span>
        </button>
      </div>
    </section>

    <footer class="footnote">
      <span>FILUM</span>
      <span>Web più leggero, controllo più vicino.</span>
    </footer>
  </main>
  <script src="newtab.js"></script>
</body>
</html>
