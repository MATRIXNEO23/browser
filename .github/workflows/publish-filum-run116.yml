name: publish-filum-run116

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-filum-run116.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated run 116 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh run download 36191598652 --repo "$GITHUB_REPOSITORY" -n Browser-Windows-x64-final -D artifact

      - name: Verify exact SHA-256
        run: |
          set -euo pipefail
          test -f artifact/Browser-Windows-x64.zip
          test -f artifact/SHA256SUMS.txt
          echo "ab9e648226b2bde4b3d988a623c9faf7565773073572f77cbf012dfeed55c08f  artifact/Browser-Windows-x64.zip" | sha256sum --check -

      - name: Publish FILUM Windows x64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="fork-0ceb643"
          NOTES="$(mktemp)"
          cat > "$NOTES" <<'EOF'
          Build Windows x64 validata dal commit sorgente esatto `0ceb64348c178a2073f326678de0bbcc557a82c7`.

          - Workflow: https://github.com/MATRIXNEO23/browser/actions/runs/36191598652
          - Esito: build e smoke test completati con successo
          - Verifiche: cicli ripetuti delle modalità; Tor bootstrap 100%; proxy SOCKS e DNS via Tor confermati; WebRTC disabilitato; controllo IsTor positivo
          - SHA-256 di `Browser-Windows-x64.zip`: `ab9e648226b2bde4b3d988a623c9faf7565773073572f77cbf012dfeed55c08f`
          - Audit e manifest: https://github.com/MATRIXNEO23/browser/blob/fix/tor-first-bootstrap/releases/FILUM_WINDOWS_X64_RUN_116.md

          Nota: la verifica visuale finale e le integrazioni che richiedono servizi esterni restano dipendenti dall'ambiente del computer dell'utente.
          EOF
          gh release create "$TAG"             artifact/Browser-Windows-x64.zip             artifact/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target 0ceb64348c178a2073f326678de0bbcc557a82c7             --title "FILUM Windows x64 — build #116"             --notes-file "$NOTES"
