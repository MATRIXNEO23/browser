name: build-windows-browser-fork

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "extension/**"
      - "fork/**"
      - "distribution/**"
      - "scripts/apply-fork-overlay.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

concurrency:
  group: browser-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout Browser project
        uses: actions/checkout@v4

      - name: Free build disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h

      - name: Install cross-build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools zip unzip mercurial python3 python3-pip
          rustup target add x86_64-pc-windows-msvc

      - name: Validate Browser sources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-fork-overlay.py scripts/validate-product.py
          python3 scripts/validate-product.py
          python3 -m json.tool fork/UPSTREAM.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool distribution/policies.json >/dev/null
          python3 -m json.tool config/defaults.json >/dev/null
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find extension -name '*.js' -print0)

      - name: Clone pinned Firefox ESR
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=$(python3 -c "import json; print(json.load(open('fork/UPSTREAM.json'))['commit'])")
          mkdir firefox-src
          cd firefox-src
          git init
          git remote add origin https://github.com/mozilla-firefox/firefox.git
          git fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"
          git rev-parse HEAD

      - name: Apply Browser fork overlay
        shell: bash
        run: |
          python3 scripts/apply-fork-overlay.py --firefox-source firefox-src --project-root "$GITHUB_WORKSPACE" --mozconfig fork/mozconfig.win64
          grep -n "browser-core" firefox-src/browser/extensions/moz.build
          grep -n "MATRIXNEO23 Browser fork" firefox-src/browser/themes/shared/toolbarbuttons.css
          cat firefox-src/mozconfig

      - name: Build native Windows Browser fork
        shell: bash
        working-directory: firefox-src
        run: |
          set -euo pipefail
          ./mach build
          ./mach package

      - name: Assemble persistent Browser ZIP
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE=$(find firefox-src/obj-browser-win64/dist -maxdepth 1 -type f -name '*.zip' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -z "$PACKAGE" ]; then
            echo "No Windows package zip produced."
            exit 1
          fi

          rm -rf dist
          mkdir -p dist/stage
          unzip -q "$PACKAGE" -d dist/stage

          BROWSER_EXE=$(find dist/stage -type f -iname 'browser.exe' | head -1)
          if [ -z "$BROWSER_EXE" ]; then
            echo "browser.exe not found in native fork package."
            find dist/stage -maxdepth 3 -type f | head -100
            exit 1
          fi

          APP_DIR=$(dirname "$BROWSER_EXE")
          mkdir -p "$APP_DIR/distribution"
          cp distribution/policies.json "$APP_DIR/distribution/policies.json"

          (
            cd dist/stage
            zip -qr ../Browser-Windows-x64.zip .
          )

          sha256sum dist/Browser-Windows-x64.zip > dist/SHA256SUMS.txt
          ls -lh dist/Browser-Windows-x64.zip
          cat dist/SHA256SUMS.txt

      - name: Upload temporary CI copy
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64
          path: |
            dist/Browser-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish persistent repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          TAG="fork-$SHORT"
          gh release create "$TAG"             dist/Browser-Windows-x64.zip             dist/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --title "Browser native fork $SHORT"             --notes "Native Browser Windows x64 fork built from pinned Firefox ESR 153 plus repository overlay. Source commit: $GITHUB_SHA"             --prerelease
