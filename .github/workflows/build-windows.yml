name: build-windows-browser-fork

on:
  workflow_dispatch:
    inputs:
      reuse_build_run_id:
        description: "Reuse a previously validated build artifact and run only Windows smoke/portable checks."
        required: false
        type: string
  push:
    branches: [ main ]
    paths:
      - "build/RELEASE_TRIGGER"

permissions:
  contents: write

concurrency:
  group: browser-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.reuse_build_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Browser project
        uses: actions/checkout@v4

      - name: Free build disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools zip unzip mercurial python3 python3-pip python3-pil wine64
          rustup target add x86_64-pc-windows-msvc

      - name: Product completeness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-fork-overlay.py scripts/validate-product.py scripts/generate-brand-assets.py
          python3 scripts/validate-product.py
          python3 scripts/audit-wiring.py
          node scripts/audit-functional.cjs
          node scripts/audit-addons.cjs
          node scripts/audit-toolbar.cjs
          python3 -m json.tool fork/UPSTREAM.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool distribution/policies.json >/dev/null
          python3 -m json.tool config/defaults.json >/dev/null
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -name '*.js' -print0)

      - name: Clone pinned Firefox ESR
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=$(python3 -c "import json; print(json.load(open('fork/UPSTREAM.json'))['commit'])")
          mkdir firefox-src
          cd firefox-src
          git init
          git remote add origin https://github.com/mozilla-firefox/firefox.git
          git fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply Browser fork overlay and branding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-fork-overlay.py --firefox-source firefox-src --project-root "$GITHUB_WORKSPACE" --mozconfig fork/mozconfig.win64
          python3 scripts/generate-brand-assets.py --source fork/branding/browser-icon.png --output firefox-src/browser/branding/browser

          grep -n "browser-core" firefox-src/browser/extensions/moz.build
          grep -n "MATRIXNEO23 Browser fork" firefox-src/browser/themes/shared/toolbarbuttons.css
          grep -n "#navigator-toolbox" firefox-src/browser/themes/shared/toolbarbuttons.css
          grep -n 'id="filum-sidebar-button"' firefox-src/browser/base/content/navigator-toolbox.inc.xhtml
          grep -n 'button.addEventListener("command"' firefox-src/browser/base/content/browser.js
          grep -n 'button.click()' firefox-src/browser/base/content/browser.js
          grep -n 'id="filum-panel-box"' firefox-src/browser/base/content/browser-box.inc.xhtml
          grep -n 'browserId: "filum-panel-browser"' firefox-src/browser/base/content/browser.js
          grep -n "MATRIXNEO23 FILUM native panel controller" firefox-src/browser/base/content/browser.js
          grep -n 'extensionId: "resource-controller@matrixneo23.browser"' firefox-src/browser/base/content/browser.js
          grep -n 'messagemanagergroup", "webext-browsers"' firefox-src/browser/base/content/browser.js
          grep -n 'webextension-view-type", "sidebar"' firefox-src/browser/base/content/browser.js
          grep -n 'extension-browser-inserted' firefox-src/browser/base/content/browser.js
          grep -n 'ext-browser-content.js' firefox-src/browser/base/content/browser.js
          grep -n -- "--enable-artifact-builds" firefox-src/mozconfig

          test -f firefox-src/browser/extensions/browser-core/extension/manifest.json
          test -f firefox-src/browser/extensions/browser-core/extension/assets/filum-background.jpg
          echo "2b2c7f659eaade035375be20f8735ab3daada878645cfb0cda5f7381721c1bc6  firefox-src/browser/extensions/browser-core/extension/assets/filum-background.jpg" | sha256sum -c -
          test -f firefox-src/browser/branding/browser/firefox.ico
          test -f firefox-src/browser/branding/browser/default256.png

      - name: Build native Windows Browser
        shell: bash
        working-directory: firefox-src
        run: |
          set -euo pipefail
          ./mach build

          # Artifact builds reuse Mozilla's precompiled Gecko executable.
          # Promote that engine binary to this product's application name
          # before the packaging manifest is evaluated.
          test -f obj-browser-win64/dist/bin/firefox.exe
          cp obj-browser-win64/dist/bin/firefox.exe obj-browser-win64/dist/bin/browser.exe

          # Build the ZIP payload only. The generic "mach package" target also
          # attempts to build Mozilla's Windows installer subtarget, which is
          # not present in this cross-artifact environment.
          gmake -C obj-browser-win64/browser/installer make-package-internal

      - name: Assemble Browser package
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="firefox-src/obj-browser-win64/dist/browser"
          if [ ! -f "$RUNTIME/browser.exe" ]; then
            echo "browser.exe not found after explicit browser/app build."
            find "$RUNTIME" -maxdepth 2 -type f | head -100
            exit 1
          fi

          rm -rf dist
          mkdir -p dist/stage/Browser
          cp -a "$RUNTIME"/. dist/stage/Browser/
          cp packaging/Start-FILUM.cmd packaging/README-PORTABLE.txt dist/stage/Browser/

          # Do not expose the upstream artifact executable as a second browser entry point.
          rm -f dist/stage/Browser/firefox.exe

          # FILUM updates are managed at product level. Remove only Mozilla's
          # standalone application updater and maintenance-service payload;
          # keep Gecko runtime, add-on updates and system add-on security updates.
          rm -f \
            dist/stage/Browser/updater.exe \
            dist/stage/Browser/updater.ini \
            dist/stage/Browser/update-settings.ini \
            dist/stage/Browser/maintenanceservice.exe \
            dist/stage/Browser/maintenanceservice_installer.exe \
            dist/stage/Browser/default-browser-agent.exe

          for updater_file in updater.exe updater.ini update-settings.ini maintenanceservice.exe maintenanceservice_installer.exe default-browser-agent.exe; do
            if [ -e "dist/stage/Browser/$updater_file" ]; then
              echo "Firefox-only updater component remains in package: $updater_file"
              exit 1
            fi
          done

          mkdir -p dist/stage/Browser/distribution
          cp distribution/policies.json dist/stage/Browser/distribution/policies.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path("dist/stage/Browser/distribution/policies.json").read_text())["policies"]
          assert policy.get("DisableAppUpdate") is True, "FILUM package must disable Firefox application updates"
          assert policy.get("ExtensionUpdate") is not False, "Do not disable extension security updates"
          assert policy.get("DisableSystemAddonUpdate") is not True, "Do not disable Gecko system add-on updates"
          PY
          cp firefox-src/browser/branding/browser/firefox.ico dist/stage/Browser/Browser.ico

          # Preserve MPL and third-party licensing material with the distribution.
          if [ -f firefox-src/LICENSE ]; then
            cp firefox-src/LICENSE dist/stage/Browser/LICENSE
          fi
          if [ -f firefox-src/toolkit/content/license.html ]; then
            cp firefox-src/toolkit/content/license.html dist/stage/Browser/LICENSE.html
          fi

          # Bundle the official stable Tor Expert Bundle for .onion/TOR mode.
          TOR_VERSION="15.0.24"
          TOR_FILE="tor-expert-bundle-windows-x86_64-$TOR_VERSION.tar.gz"
          TOR_SHA256="e9dc6ccc93cd6afa507193f4de284d6424233ff5102155cd2c94b259e8a22b65"
          TOR_URL="https://dist.torproject.org/torbrowser/$TOR_VERSION/$TOR_FILE"

          curl --fail --location --retry 3 --retry-delay 2 "$TOR_URL" -o "/tmp/$TOR_FILE"
          echo "$TOR_SHA256  /tmp/$TOR_FILE" | sha256sum -c -

          mkdir -p dist/stage/Browser/tor-expert
          tar -xzf "/tmp/$TOR_FILE" -C dist/stage/Browser/tor-expert

          TOR_EXE=$(find dist/stage/Browser/tor-expert -type f -iname 'tor.exe' | head -1)
          if [ -z "$TOR_EXE" ]; then
            echo "Bundled Tor executable missing after extraction."
            exit 1
          fi

          printf 'Tor Expert Bundle %s\nSource: %s\nSHA256: %s\n' \
            "$TOR_VERSION" "$TOR_URL" "$TOR_SHA256" \
            > dist/stage/Browser/tor-expert/FILUM_TOR_SOURCE.txt

          OMNI_MATCHES=$(find dist/stage/Browser -type f -name 'omni.ja' -print)
          if [ -z "$OMNI_MATCHES" ]; then
            echo "omni.ja missing."
            exit 1
          fi

          BUILTIN_FOUND=0
          NATIVE_BUTTON_FOUND=0
          NATIVE_PANEL_FOUND=0
          NATIVE_CONTROLLER_FOUND=0
          CYBER_BACKGROUND_FOUND=0
          while IFS= read -r omni; do
            LISTING=$(unzip -Z1 "$omni" 2>/dev/null || true)
            BROWSER_XHTML=$(unzip -p "$omni" 'chrome/browser/content/browser/browser.xhtml' 2>/dev/null || true)
            BROWSER_JS=$(unzip -p "$omni" 'chrome/browser/content/browser/browser.js' 2>/dev/null || true)

            if [[ "$LISTING" == *"chrome/browser/builtin-addons/browser-core/manifest.json"* ]]; then
              BUILTIN_FOUND=1
            fi

            if [[ "$LISTING" == *"chrome/browser/builtin-addons/browser-core/assets/filum-background.jpg"* ]]; then
              CYBER_BACKGROUND_FOUND=1
            fi

            if grep -aq 'buttonId: "filum-sidebar-button"' <<< "$BROWSER_JS" && \
               grep -aq 'button.addEventListener("command"' <<< "$BROWSER_JS" && \
               grep -aq 'id="filum-sidebar-button"' <<< "$BROWSER_XHTML"; then
              NATIVE_BUTTON_FOUND=1
            fi

            if grep -aq 'id="filum-panel-box"' <<< "$BROWSER_XHTML"; then
              NATIVE_PANEL_FOUND=1
            fi

            if grep -aq 'MATRIXNEO23 FILUM native panel controller' <<< "$BROWSER_JS"; then
              NATIVE_CONTROLLER_FOUND=1
            fi
          done <<< "$OMNI_MATCHES"

          if [ "$BUILTIN_FOUND" -ne 1 ]; then
            echo "FILUM core not found in built-in addon resources."
            exit 1
          fi

          if [ "$NATIVE_BUTTON_FOUND" -ne 1 ]; then
            echo "Native FILUM toolbar button not found in packaged chrome."
            exit 1
          fi

          if [ "$NATIVE_PANEL_FOUND" -ne 1 ]; then
            echo "Native FILUM panel markup not found in packaged chrome."
            exit 1
          fi

          if [ "$NATIVE_CONTROLLER_FOUND" -ne 1 ]; then
            echo "Native FILUM panel controller not found in packaged chrome."
            exit 1
          fi

          if [ "$CYBER_BACKGROUND_FOUND" -ne 1 ]; then
            echo "Approved FILUM cyber background not found in packaged core."
            exit 1
          fi

          (
            cd dist/stage
            zip -qr ../Browser-Windows-x64.zip Browser
          )

          sha256sum dist/Browser-Windows-x64.zip > dist/SHA256SUMS.txt
          ls -lh dist/Browser-Windows-x64.zip
          cat dist/SHA256SUMS.txt

      - name: Upload build for Windows smoke test
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64
          path: |
            dist/Browser-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    needs: build
    if: ${{ always() && needs.build.result != 'failure' && needs.build.result != 'cancelled' }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Browser project for runtime harness
        uses: actions/checkout@v4

      - name: Download Browser build
        uses: actions/download-artifact@v4
        with:
          name: Browser-Windows-x64
          path: artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.reuse_build_run_id || github.run_id }}

      - name: Verify incoming checksum and locate Browser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Resolve-Path ".\artifact\Browser-Windows-x64.zip"
          $sumLine = (Get-Content ".\artifact\SHA256SUMS.txt" -Raw).Trim()
          $expected = ($sumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch." }

          Expand-Archive -Path $zip -DestinationPath ".\stage"
          $exe = Get-ChildItem ".\stage" -Recurse -Filter "browser.exe" | Select-Object -First 1
          if (-not $exe) { throw "browser.exe missing from final package." }

          $icon = Join-Path $exe.Directory.FullName "Browser.ico"
          if (-not (Test-Path $icon)) { throw "Canonical Browser.ico missing." }

          "BROWSER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BROWSER_ICON=$icon" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply final Windows identity and FILUM icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-Item $env:BROWSER_EXE
          $before = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $rawVersion = $exe.VersionInfo.ProductVersion
          $nums = @([regex]::Matches([string]$rawVersion, "\d+") | ForEach-Object { [int]$_.Value })
          while ($nums.Count -lt 4) { $nums += 0 }
          $version = "$($nums[0]).$($nums[1]).$($nums[2]).$($nums[3])"
          $patched = Join-Path $exe.Directory.FullName "browser.patched.exe"

          npx --yes resedit-cli@3.1.0 `
            --in $exe.FullName `
            --out $patched `
            --ignore-signed `
            --icon "1,$env:BROWSER_ICON" `
            --company-name "MATRIXNEO23" `
            --file-description "Browser" `
            --product-name "Browser" `
            --original-filename "browser.exe" `
            --internal-name "Browser" `
            --file-version $version `
            --product-version $version

          if ($LASTEXITCODE -ne 0) { throw "resedit-cli failed." }
          if (-not (Test-Path $patched)) { throw "Patched browser.exe was not produced." }

          Move-Item -Force $patched $exe.FullName
          $after = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if ($after -eq $before) { throw "Windows resources were not changed." }

          $vi = (Get-Item $exe.FullName).VersionInfo
          Write-Host "ProductName: $($vi.ProductName)"
          Write-Host "FileDescription: $($vi.FileDescription)"
          Write-Host "CompanyName: $($vi.CompanyName)"
          if ($vi.ProductName -ne "Browser") { throw "ProductName is not Browser." }
          if ($vi.FileDescription -ne "Browser") { throw "FileDescription is not Browser." }
          if ($vi.CompanyName -ne "MATRIXNEO23") { throw "CompanyName is not MATRIXNEO23." }

          Remove-Item -Force $env:BROWSER_ICON
          Remove-Item -Force ".\artifact\Browser-Windows-x64.zip"
          Compress-Archive -Path ".\stage\Browser" -DestinationPath ".\artifact\Browser-Windows-x64.zip" -CompressionLevel Optimal
          $finalHash = (Get-FileHash ".\artifact\Browser-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$finalHash  Browser-Windows-x64.zip" | Set-Content ".\artifact\SHA256SUMS.txt" -Encoding ascii
          Write-Host "Final SHA256: $finalHash"

      - name: Verify built-in Browser core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $found = $false
          Get-ChildItem $env:APP_DIR -Recurse -Filter "omni.ja" | ForEach-Object {
            $listing = (& 7z l $_.FullName | Out-String)
            if ($listing -match "builtin-addons[\\/]browser-core[\\/]manifest.json") { $found = $true }
          }
          if (-not $found) { throw "Browser Control Core is not registered in packaged omni resources." }

      - name: Verify bundled TOR executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tor = Get-ChildItem $env:APP_DIR -Recurse -Filter "tor.exe" | Select-Object -First 1
          if (-not $tor) { throw "Bundled tor.exe missing." }

          $version = (& $tor.FullName --version | Out-String)
          Write-Host $version
          if ($version -notmatch "Tor version") {
            throw "Bundled Tor executable did not report a Tor version."
          }

      - name: Verify Firefox application updater payload is absent
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $updaterFiles = @(
            "updater.exe",
            "updater.ini",
            "update-settings.ini",
            "maintenanceservice.exe",
            "maintenanceservice_installer.exe",
            "default-browser-agent.exe"
          )
          foreach ($name in $updaterFiles) {
            $path = Join-Path $env:APP_DIR $name
            if (Test-Path $path) { throw "Mozilla-only updater component is still packaged: $name" }
          }
          $policies = Get-Content (Join-Path $env:APP_DIR "distribution/policies.json") -Raw | ConvertFrom-Json
          if (-not $policies.policies.DisableAppUpdate) { throw "Firefox application update policy is not disabled." }
          if (-not $policies.policies.DisableDefaultBrowserAgent) { throw "Firefox Default Browser Agent must remain disabled." }
          if ($policies.policies.ExtensionUpdate -eq $false) { throw "Extension security updates must remain enabled." }
          if ($policies.policies.DisableSystemAddonUpdate -eq $true) { throw "Gecko system add-on updates must remain enabled." }
          Write-Host "Mozilla application updater payload and Default Browser Agent disabled; extension and system add-on update policies preserved."

      - name: Launch Browser runtime smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $hostSnapshot = Join-Path $env:RUNNER_TEMP "filum-portable-host-baseline.json"
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/test-portable-host.ps1") -Phase Before -SnapshotPath $hostSnapshot

          $profile = Join-Path $env:APP_DIR "profile"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null

          @(
            'user_pref("filum.selftest.enabled", true);',
            'user_pref("filum.portability.marker", "FILUM_PORTABLE_PROFILE_SENTINEL");'
          ) | Set-Content (Join-Path $profile "user.js") -Encoding ascii

          $portableLauncher = Join-Path $env:APP_DIR "Start-FILUM.cmd"
          if (-not (Test-Path $portableLauncher)) { throw "Start-FILUM.cmd missing from package." }
          $launcher = Start-Process -FilePath $portableLauncher -PassThru
          $deadline = (Get-Date).AddSeconds(20)
          $alive = $false

          try {
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 1

              $processes = Get-CimInstance Win32_Process | Where-Object {
                $_.Name -ieq "browser.exe" -and
                $_.ExecutablePath -and
                ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($env:BROWSER_EXE))
              }

              if ($processes) {
                $alive = $true
                break
              }

              if (-not $launcher.HasExited) {
                $alive = $true
                break
              }

              $launcher.Refresh()
            }

            if (-not $alive) {
              throw "Browser runtime did not remain active after launch."
            }

            $extensionsJson = Join-Path $profile "extensions.json"
            $extensionsDeadline = (Get-Date).AddSeconds(45)
            while ((Get-Date) -lt $extensionsDeadline -and -not (Test-Path $extensionsJson)) {
              Start-Sleep -Seconds 1
            }
            if (-not (Test-Path $extensionsJson)) { throw "Browser profile missing extensions.json." }

            $profileFiles = Get-ChildItem $profile -Force -ErrorAction SilentlyContinue

            $extensions = Get-Content $extensionsJson -Raw | ConvertFrom-Json
            $core = $extensions.addons | Where-Object { $_.id -eq "resource-controller@matrixneo23.browser" } | Select-Object -First 1

            if (-not $core) {
              throw "Browser Control Core is packaged but not registered in the runtime profile."
            }

            Write-Host "Core active: $($core.active)"
            Write-Host "Core appDisabled: $($core.appDisabled)"
            Write-Host "Core userDisabled: $($core.userDisabled)"
            Write-Host "Core location: $($core.location)"

            if (-not $core.active) {
              throw "Browser Control Core is registered but inactive."
            }
            if ($core.appDisabled) {
              throw "Browser Control Core is app-disabled."
            }
            if ($core.userDisabled) {
              throw "Browser Control Core is user-disabled."
            }

            if ($core.version -ne "0.4.1") {
              throw "Unexpected FILUM core version: $($core.version)"
            }

            $prefsPath = Join-Path $profile "prefs.js"
            $controlDeadline = (Get-Date).AddSeconds(360)
            $controlsRaw = $null
            while ((Get-Date) -lt $controlDeadline) {
              Start-Sleep -Seconds 2
              if (-not (Test-Path $prefsPath)) { continue }
              $prefsText = Get-Content $prefsPath -Raw
              $panelFailure = [regex]::Match(
                $prefsText,
                'user_pref\("filum\.selftest\.panel",\s*"FAIL:((?:\\.|[^"])*)"\);'
              )
              if ($panelFailure.Success) {
                throw "FILUM panel self-test failed: $($panelFailure.Groups[1].Value)"
              }
              $controlMatch = [regex]::Match(
                $prefsText,
                'user_pref\("filum\.selftest\.controls",\s*"((?:\\.|[^"])*)"\);'
              )
              if ($controlMatch.Success) {
                $encoded = '"' + $controlMatch.Groups[1].Value + '"'
                $controlsRaw = $encoded | ConvertFrom-Json
                break
              }
            }

            if (-not $controlsRaw) {
              if (Test-Path $prefsPath) {
                $panelMatch = [regex]::Match(
                  (Get-Content $prefsPath -Raw),
                  'user_pref\("filum\.selftest\.panel",\s*"((?:\\.|[^"])*)"\);'
                )
                if ($panelMatch.Success) {
                  Write-Host "FILUM panel self-test state: $($panelMatch.Groups[1].Value)"
                }
              }
              throw "FILUM control self-test did not report a result."
            }

            $controls = $controlsRaw | ConvertFrom-Json
            Write-Host "FILUM controls self-test: $($controlsRaw)"
            if (-not $controls.passed) {
              $failed = @($controls.checks | Where-Object { -not $_.ok })
              $detail = ($failed | ForEach-Object {
                "$($_.name): $($_.detail)"
              }) -join "; "
              throw "FILUM control self-test failed: $detail"
            }

            $nativeMenuDeadline = (Get-Date).AddSeconds(20)
            $nativeMenuPassed = $false
            while ((Get-Date) -lt $nativeMenuDeadline) {
              if (Test-Path $prefsPath) {
                $prefsText = Get-Content $prefsPath -Raw
                $panelState = [regex]::Match(
                  $prefsText,
                  'user_pref\("filum\.selftest\.panel",\s*"((?:\\.|[^"])*)"\);'
                )
                if ($panelState.Success -and $panelState.Groups[1].Value -match '^PASS:NATIVE_MENU_PASS:') {
                  $nativeMenuPassed = $true
                  Write-Host "Native Firefox app menu self-test: $($panelState.Groups[1].Value)"
                  break
                }
                if ($panelState.Success -and $panelState.Groups[1].Value -match '^FAIL:') {
                  throw "Native Firefox app menu self-test failed: $($panelState.Groups[1].Value)"
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $nativeMenuPassed) {
              throw "Native Firefox app menu self-test did not report PASS."
            }

            $portableTemp = Join-Path $env:APP_DIR "temp"
            if (-not (Test-Path $portableTemp)) { throw "Portable launcher did not create its package-local temp directory." }

            Write-Host "Windows Browser runtime launch passed."
            Write-Host "Profile initialized with $($profileFiles.Count) entries."
            Write-Host "Portable profile path: $profile"
            Write-Host "Portable TEMP/TMP path: $portableTemp"
            Write-Host "FILUM core runtime activation passed."
            Write-Host "FILUM native panel loaded and ran the functional control report."
            Write-Host "FILUM sidebar controls functional test passed."

          }
          finally {
            $mainBrowser = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -ieq "browser.exe" -and $_.ExecutablePath -and
              ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($env:BROWSER_EXE)) -and
              $_.CommandLine -like "*$profile*"
            } | Select-Object -First 1
            if ($mainBrowser) {
              $mainProcess = Get-Process -Id $mainBrowser.ProcessId -ErrorAction SilentlyContinue
              if ($mainProcess -and $mainProcess.MainWindowHandle -ne 0) {
                $null = $mainProcess.CloseMainWindow()
              }
            }
            $shutdownDeadline = (Get-Date).AddSeconds(60)
            do {
              $remainingBrowsers = @(Get-CimInstance Win32_Process | Where-Object {
                $_.Name -ieq "browser.exe" -and $_.ExecutablePath -and
                [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($env:BROWSER_EXE)
              })
              if (-not $remainingBrowsers.Count) { break }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $shutdownDeadline)
            if ($remainingBrowsers.Count) {
              $remaining = ($remainingBrowsers | ForEach-Object { $_.CommandLine }) -join " | "
              throw "Gecko did not exit cleanly; refusing to kill possible background tasks: $remaining"
            }
          }

      - name: Verify portable profile survives moving the package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceRoot = $env:APP_DIR
          $sourceProfile = Join-Path $sourceRoot "profile"
          $prefs = Join-Path $sourceProfile "prefs.js"
          if (-not (Test-Path $prefs)) { throw "Portable profile prefs.js missing after smoke." }
          if (-not (Select-String -Path $prefs -SimpleMatch "FILUM_PORTABLE_PROFILE_SENTINEL" -Quiet)) {
            throw "Portable profile sentinel was not persisted in prefs.js."
          }
          $prefsLines = [System.IO.File]::ReadAllLines($prefs)
          $prefsLines = $prefsLines | Where-Object { $_ -notmatch '^user_pref\("filum\.selftest\.enabled",' }
          [System.IO.File]::WriteAllLines(
            $prefs,
            [string[]]$prefsLines,
            [System.Text.UTF8Encoding]::new($false)
          )
          foreach ($relative in @("places.sqlite", "extensions.json")) {
            if (-not (Test-Path (Join-Path $sourceProfile $relative))) {
              throw "Portable profile data file missing before move: $relative"
            }
          }

          Remove-Item -Force (Join-Path $sourceProfile "user.js")
          $movedRoot = Join-Path (Split-Path -Parent $sourceRoot) "FILUM-portable-moved"
          if (Test-Path $movedRoot) { Remove-Item -Recurse -Force $movedRoot }
          Move-Item -Path $sourceRoot -Destination $movedRoot
          $movedProfile = Join-Path $movedRoot "profile"
          $launcherPath = Join-Path $movedRoot "Start-FILUM.cmd"
          if (-not (Test-Path $launcherPath)) { throw "Portable launcher missing after moving package." }

          $launcher = Start-Process -FilePath $launcherPath -PassThru
          $browserPath = Join-Path $movedRoot "browser.exe"
          $deadline = (Get-Date).AddSeconds(30)
          $browserProcess = $null
          try {
            while ((Get-Date) -lt $deadline) {
              $browserProcess = Get-CimInstance Win32_Process | Where-Object {
                $_.Name -ieq "browser.exe" -and $_.ExecutablePath -and
                ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($browserPath))
              } | Select-Object -First 1
              if ($browserProcess) { break }
              Start-Sleep -Milliseconds 500
            }
            if (-not $browserProcess) { throw "FILUM did not start after moving the package folder." }
            if ($browserProcess.CommandLine -notlike "*$movedProfile*") {
              throw "Moved FILUM process is not using its package-local profile: $($browserProcess.CommandLine)"
            }
            Start-Sleep -Seconds 5
          }
          finally {
            $mainBrowser = Get-CimInstance Win32_Process | Where-Object {
              $_.Name -ieq "browser.exe" -and $_.ExecutablePath -and
              ([System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($browserPath)) -and
              $_.CommandLine -like "*$movedProfile*"
            } | Select-Object -First 1
            if ($mainBrowser) {
              $mainProcess = Get-Process -Id $mainBrowser.ProcessId -ErrorAction SilentlyContinue
              if ($mainProcess -and $mainProcess.MainWindowHandle -ne 0) {
                $null = $mainProcess.CloseMainWindow()
              }
            }
            $shutdownDeadline = (Get-Date).AddSeconds(60)
            do {
              $remainingBrowsers = @(Get-CimInstance Win32_Process | Where-Object {
                $_.Name -ieq "browser.exe" -and $_.ExecutablePath -and
                [System.IO.Path]::GetFullPath($_.ExecutablePath) -eq [System.IO.Path]::GetFullPath($browserPath)
              })
              if (-not $remainingBrowsers.Count) { break }
              Start-Sleep -Seconds 1
            } while ((Get-Date) -lt $shutdownDeadline)
            if ($remainingBrowsers.Count) {
              $remaining = ($remainingBrowsers | ForEach-Object { $_.CommandLine }) -join " | "
              throw "Gecko did not exit cleanly after package move; refusing to kill possible background tasks: $remaining"
            }
            if ($launcher -and -not $launcher.HasExited) {
              Stop-Process -Id $launcher.Id -Force -ErrorAction SilentlyContinue
            }
          }

          if (-not (Select-String -Path (Join-Path $movedProfile "prefs.js") -SimpleMatch "FILUM_PORTABLE_PROFILE_SENTINEL" -Quiet)) {
            throw "The moved package did not retain its persisted profile preference."
          }
          if (-not (Test-Path (Join-Path $movedRoot "temp"))) { throw "Moved package-local temp directory missing." }
          Write-Host "Default-agent profile metadata is validated as a persistent Gecko background-task profile."
          & (Join-Path $env:GITHUB_WORKSPACE "scripts/test-portable-host.ps1") -Phase After -SnapshotPath (Join-Path $env:RUNNER_TEMP "filum-portable-host-baseline.json")
          Write-Host "Portable profile A-to-B move: PASS"
          Write-Host "Moved profile: $movedProfile"

          # Rebuild the downloadable ZIP from the exact Windows-tested files,
          # excluding the temporary CI profile and TEMP directory.
          Remove-Item -Recurse -Force (Join-Path $movedRoot "profile"), (Join-Path $movedRoot "temp") -ErrorAction SilentlyContinue
          Move-Item -Path $movedRoot -Destination $sourceRoot
          $finalZip = Join-Path $env:GITHUB_WORKSPACE "artifact/Browser-Windows-x64.zip"
          Compress-Archive -Path $sourceRoot -DestinationPath $finalZip -CompressionLevel Optimal -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipCheck = [System.IO.Compression.ZipFile]::OpenRead($finalZip)
          try {
            $zipEntries = @($zipCheck.Entries | ForEach-Object { $_.FullName })
            if ($zipEntries -notcontains "Browser/browser.exe") { throw "Final ZIP has an unexpected root layout." }
            if ($zipEntries | Where-Object { $_ -match '^Browser/(profile|temp)/' }) {
              throw "Final ZIP contains the CI profile or temporary files."
            }
            $forbiddenNames = @("updater.exe", "updater.ini", "update-settings.ini", "maintenanceservice.exe", "maintenanceservice_installer.exe", "default-browser-agent.exe")
            $remainingUpdaterFiles = @($zipEntries | Where-Object { ($_.Split('/')[-1]) -in $forbiddenNames })
            if ($remainingUpdaterFiles.Count) { throw "Final ZIP contains Mozilla app-updater payload: $($remainingUpdaterFiles -join ', ')" }
          }
          finally {
            $zipCheck.Dispose()
          }
          $finalHash = (Get-FileHash $finalZip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$finalHash  Browser-Windows-x64.zip" | Set-Content (Join-Path $env:GITHUB_WORKSPACE "artifact/SHA256SUMS.txt") -Encoding ascii
          Write-Host "Validated final Windows ZIP SHA256: $finalHash"

      - name: Upload validated final Browser
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64-final
          path: |
            artifact/Browser-Windows-x64.zip
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    if: false
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: Browser-Windows-x64-final
          path: artifact

      - name: Publish stable repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          TAG="browser-$SHORT"

          gh release create "$TAG" \
            artifact/Browser-Windows-x64.zip \
            artifact/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "FILUM Windows x64 privacy build $SHORT" \
            --notes "FILUM Windows x64 privacy build. Passed product and wiring gates, native package validation, Gecko runtime smoke and Tor bootstrap checks. The FILUM Policy Engine includes four protection presets with independently configurable global controls. Per-site overrides remain explicitly unavailable where Gecko does not expose a verified control; Canvas uses Gecko RFP and is broader than Canvas alone. Source commit: $GITHUB_SHA"
