name: build-windows-browser-fork

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "build/RELEASE_TRIGGER"

permissions:
  contents: write

concurrency:
  group: browser-final-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout Browser project
        uses: actions/checkout@v4

      - name: Free build disk
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/.ghcup || true
          df -h

      - name: Install build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y msitools zip unzip mercurial python3 python3-pip python3-pil python3-cairosvg wine64
          rustup target add x86_64-pc-windows-msvc

      - name: Product completeness gate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply-fork-overlay.py scripts/validate-product.py scripts/generate-brand-assets.py
          python3 scripts/validate-product.py
          python3 -m json.tool fork/UPSTREAM.json >/dev/null
          python3 -m json.tool extension/manifest.json >/dev/null
          python3 -m json.tool distribution/policies.json >/dev/null
          python3 -m json.tool config/defaults.json >/dev/null
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find extension -name '*.js' -print0)

      - name: Clone pinned Firefox ESR
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_COMMIT=$(python3 -c "import json; print(json.load(open('fork/UPSTREAM.json'))['commit'])")
          mkdir firefox-src
          cd firefox-src
          git init
          git remote add origin https://github.com/mozilla-firefox/firefox.git
          git fetch --depth=1 origin "$UPSTREAM_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Apply Browser fork overlay and branding
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply-fork-overlay.py --firefox-source firefox-src --project-root "$GITHUB_WORKSPACE" --mozconfig fork/mozconfig.win64
          python3 scripts/generate-brand-assets.py --source fork/branding/browser-icon.svg --output firefox-src/browser/branding/browser

          grep -n "browser-core" firefox-src/browser/extensions/moz.build
          grep -n "MATRIXNEO23 Browser fork" firefox-src/browser/themes/shared/toolbarbuttons.css
          grep -n "#navigator-toolbox" firefox-src/browser/themes/shared/toolbarbuttons.css
          grep -n -- "--enable-artifact-builds" firefox-src/mozconfig

          test -f firefox-src/browser/extensions/browser-core/extension/manifest.json
          test -f firefox-src/browser/branding/browser/firefox.ico
          test -f firefox-src/browser/branding/browser/default256.png

      - name: Build native Windows Browser
        shell: bash
        working-directory: firefox-src
        run: |
          set -euo pipefail
          ./mach build

          # Artifact builds reuse Mozilla's precompiled Gecko executable.
          # Promote that engine binary to this product's application name
          # before the packaging manifest is evaluated.
          test -f obj-browser-win64/dist/bin/firefox.exe
          cp obj-browser-win64/dist/bin/firefox.exe obj-browser-win64/dist/bin/browser.exe

          # Build the ZIP payload only. The generic "mach package" target also
          # attempts to build Mozilla's Windows installer subtarget, which is
          # not present in this cross-artifact environment.
          gmake -C obj-browser-win64/browser/installer make-package-internal

      - name: Assemble Browser package
        shell: bash
        run: |
          set -euo pipefail

          RUNTIME="firefox-src/obj-browser-win64/dist/browser"
          if [ ! -f "$RUNTIME/browser.exe" ]; then
            echo "browser.exe not found after explicit browser/app build."
            find "$RUNTIME" -maxdepth 2 -type f | head -100
            exit 1
          fi

          rm -rf dist
          mkdir -p dist/stage/Browser
          cp -a "$RUNTIME"/. dist/stage/Browser/

          # Do not expose the upstream artifact executable as a second browser entry point.
          rm -f dist/stage/Browser/firefox.exe

          mkdir -p dist/stage/Browser/distribution
          cp distribution/policies.json dist/stage/Browser/distribution/policies.json
          cp firefox-src/browser/branding/browser/firefox.ico dist/stage/Browser/Browser.ico

          # Preserve MPL and third-party licensing material with the distribution.
          if [ -f firefox-src/LICENSE ]; then
            cp firefox-src/LICENSE dist/stage/Browser/LICENSE
          fi
          if [ -f firefox-src/toolkit/content/license.html ]; then
            cp firefox-src/toolkit/content/license.html dist/stage/Browser/LICENSE.html
          fi

          OMNI_MATCHES=$(find dist/stage/Browser -type f -name 'omni.ja' -print)
          if [ -z "$OMNI_MATCHES" ]; then
            echo "omni.ja missing."
            exit 1
          fi

          BUILTIN_FOUND=0
          while IFS= read -r omni; do
            if unzip -l "$omni" 2>/dev/null | grep -q 'builtin-addons/browser-core/manifest.json'; then
              BUILTIN_FOUND=1
              break
            fi
          done <<< "$OMNI_MATCHES"

          if [ "$BUILTIN_FOUND" -ne 1 ]; then
            echo "Browser Control Core not found in built-in addon resources."
            exit 1
          fi

          (
            cd dist/stage
            zip -qr ../Browser-Windows-x64.zip Browser
          )

          sha256sum dist/Browser-Windows-x64.zip > dist/SHA256SUMS.txt
          ls -lh dist/Browser-Windows-x64.zip
          cat dist/SHA256SUMS.txt

      - name: Upload build for Windows smoke test
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64
          path: |
            dist/Browser-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Download Browser build
        uses: actions/download-artifact@v4
        with:
          name: Browser-Windows-x64
          path: artifact

      - name: Verify incoming checksum and locate Browser
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zip = Resolve-Path ".\artifact\Browser-Windows-x64.zip"
          $sumLine = (Get-Content ".\artifact\SHA256SUMS.txt" -Raw).Trim()
          $expected = ($sumLine -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "SHA256 mismatch." }

          Expand-Archive -Path $zip -DestinationPath ".\stage"
          $exe = Get-ChildItem ".\stage" -Recurse -Filter "browser.exe" | Select-Object -First 1
          if (-not $exe) { throw "browser.exe missing from final package." }

          $icon = Join-Path $exe.Directory.FullName "Browser.ico"
          if (-not (Test-Path $icon)) { throw "Canonical Browser.ico missing." }

          "BROWSER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "APP_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "BROWSER_ICON=$icon" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Apply final Windows identity and FILUM icon
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $exe = Get-Item $env:BROWSER_EXE
          $before = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $rawVersion = $exe.VersionInfo.ProductVersion
          $nums = @([regex]::Matches([string]$rawVersion, "\d+") | ForEach-Object { [int]$_.Value })
          while ($nums.Count -lt 4) { $nums += 0 }
          $version = "$($nums[0]).$($nums[1]).$($nums[2]).$($nums[3])"
          $patched = Join-Path $exe.Directory.FullName "browser.patched.exe"

          npx --yes resedit-cli@3.1.0 `
            --in $exe.FullName `
            --out $patched `
            --ignore-signed `
            --icon "1,$env:BROWSER_ICON" `
            --company-name "MATRIXNEO23" `
            --file-description "Browser" `
            --product-name "Browser" `
            --original-filename "browser.exe" `
            --internal-name "Browser" `
            --file-version $version `
            --product-version $version

          if ($LASTEXITCODE -ne 0) { throw "resedit-cli failed." }
          if (-not (Test-Path $patched)) { throw "Patched browser.exe was not produced." }

          Move-Item -Force $patched $exe.FullName
          $after = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          if ($after -eq $before) { throw "Windows resources were not changed." }

          $vi = (Get-Item $exe.FullName).VersionInfo
          Write-Host "ProductName: $($vi.ProductName)"
          Write-Host "FileDescription: $($vi.FileDescription)"
          Write-Host "CompanyName: $($vi.CompanyName)"
          if ($vi.ProductName -ne "Browser") { throw "ProductName is not Browser." }
          if ($vi.FileDescription -ne "Browser") { throw "FileDescription is not Browser." }
          if ($vi.CompanyName -ne "MATRIXNEO23") { throw "CompanyName is not MATRIXNEO23." }

          Remove-Item -Force $env:BROWSER_ICON
          Remove-Item -Force ".\artifact\Browser-Windows-x64.zip"
          Compress-Archive -Path ".\stage\Browser" -DestinationPath ".\artifact\Browser-Windows-x64.zip" -CompressionLevel Optimal
          $finalHash = (Get-FileHash ".\artifact\Browser-Windows-x64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$finalHash  Browser-Windows-x64.zip" | Set-Content ".\artifact\SHA256SUMS.txt" -Encoding ascii
          Write-Host "Final SHA256: $finalHash"

      - name: Verify built-in Browser core
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $found = $false
          Get-ChildItem $env:APP_DIR -Recurse -Filter "omni.ja" | ForEach-Object {
            $listing = (& 7z l $_.FullName | Out-String)
            if ($listing -match "builtin-addons[\\/]browser-core[\\/]manifest.json") { $found = $true }
          }
          if (-not $found) { throw "Browser Control Core is not registered in packaged omni resources." }

      - name: Launch Browser and render custom New Tab
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $profile = Join-Path $env:RUNNER_TEMP "browser-smoke-profile"
          $shot = Join-Path $env:GITHUB_WORKSPACE "Browser-NewTab-Smoke.png"
          New-Item -ItemType Directory -Force -Path $profile | Out-Null
          $args = @(
            "-headless",
            "-no-remote",
            "-profile", $profile,
            "-screenshot", $shot,
            "about:newtab"
          )
          $p = Start-Process -FilePath $env:BROWSER_EXE -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Browser headless launch failed with exit code $($p.ExitCode)." }
          if (-not (Test-Path $shot)) { throw "Browser did not render the New Tab screenshot." }
          if ((Get-Item $shot).Length -lt 4096) { throw "New Tab smoke screenshot is unexpectedly small." }
          Write-Host "Windows launch + New Tab render passed."

      - name: Upload visual smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Visual-Smoke
          path: Browser-NewTab-Smoke.png
          if-no-files-found: error
          retention-days: 30

      - name: Upload validated final Browser
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64-final
          path: |
            artifact/Browser-Windows-x64.zip
            artifact/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
  release:
    needs: [build, smoke-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: Browser-Windows-x64-final
          path: artifact

      - name: Publish stable repository release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHORT="${GITHUB_SHA:0:7}"
          TAG="browser-$SHORT"

          gh release create "$TAG" \
            artifact/Browser-Windows-x64.zip \
            artifact/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Browser Windows x64 $SHORT" \
            --notes "Stable Browser Windows x64 build. Passed source completeness gate, native package validation, built-in core verification, SHA256 verification and Windows headless New Tab smoke test. Source commit: $GITHUB_SHA"
