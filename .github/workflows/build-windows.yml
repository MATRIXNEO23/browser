name: build-windows-browser

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "extension/**"
      - "profiles/**"
      - "distribution/**"
      - "scripts/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate browser sources
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -Path ".\extension" -Recurse -Filter "*.js" | ForEach-Object {
            Write-Host "node --check $($_.FullName)"
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed: $($_.FullName)" }
          }
          Get-ChildItem -Path ".\extension" -Recurse -Filter "*.json" | ForEach-Object {
            Get-Content -Raw $_.FullName | ConvertFrom-Json | Out-Null
          }
          Get-Content -Raw ".\distribution\policies.json" | ConvertFrom-Json | Out-Null
          Get-Content -Raw ".\config\defaults.json" | ConvertFrom-Json | Out-Null

      - name: Download Firefox ESR runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://download.mozilla.org/?product=firefox-esr-latest-ssl&os=win64&lang=it"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\firefox-esr.exe"

      - name: Install Firefox ESR into staging
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "$env:RUNNER_TEMP\firefox-esr"
          $args = @(
            "/S",
            "/InstallDirectoryPath=$out",
            "/DesktopShortcut=false",
            "/TaskbarShortcut=false",
            "/MaintenanceService=false"
          )
          Start-Process -FilePath "$env:RUNNER_TEMP\firefox-esr.exe" -ArgumentList $args -Wait
          if (-not (Test-Path "$out\firefox.exe")) {
            throw "Firefox ESR staging install not found."
          }

      - name: Enable MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build portable browser
        shell: pwsh
        run: |
          .\scripts\build-portable.ps1 -FirefoxRuntimePath "$env:RUNNER_TEMP\firefox-esr"

      - name: Archive browser and checksum
        shell: pwsh
        run: |
          $zip = ".\dist\Browser-Windows-x64.zip"
          Compress-Archive -Path ".\dist\Browser\*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Browser-Windows-x64.zip" | Set-Content ".\dist\SHA256SUMS.txt" -Encoding ascii

      - name: Upload temporary workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Browser-Windows-x64
          path: |
            dist/Browser-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish persistent repository release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $short = $env:GITHUB_SHA.Substring(0, 7)
          $tag = "build-$short"
          $title = "Browser build $short"
          $notes = "Persistent Windows x64 build from commit $env:GITHUB_SHA. Includes SHA256SUMS.txt."
          gh release create $tag ".\dist\Browser-Windows-x64.zip" ".\dist\SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "$title" --notes "$notes" --prerelease
