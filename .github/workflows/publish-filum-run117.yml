name: publish-filum-run117

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/publish-filum-run117.yml"

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download validated run 117 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir artifact
          gh run download 36206348167 --repo "$GITHUB_REPOSITORY" -n Browser-Windows-x64-final -D artifact

      - name: Verify packaged checksum
        run: |
          set -euo pipefail
          test -f artifact/Browser-Windows-x64.zip
          test -f artifact/SHA256SUMS.txt
          (cd artifact && sha256sum --check SHA256SUMS.txt)

      - name: Publish FILUM Windows x64 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "fork-3044309"             artifact/Browser-Windows-x64.zip             artifact/SHA256SUMS.txt             --repo "$GITHUB_REPOSITORY"             --target 3044309c6c72160d0423e76f19a202628285c93d             --title "FILUM Windows x64 — build #117"             --notes "Build Windows x64 dal commit 3044309c6c72160d0423e76f19a202628285c93d. Corregge il ciclo addon disattiva, riattiva e rimuovi tramite AddonManager privilegiato con verifica dello stato. Conferma about:newtab come destinazione stabile della pagina iniziale FILUM. Product gate, build nativa e smoke test Windows completati con successo: https://github.com/MATRIXNEO23/browser/actions/runs/36206348167"
